# Drasi Server config for the building_comfort DYNAMIC test driver —
# STATE STORE profile.
#
# Same as drasi_server.empty.yaml but with an instance-level redb state store.
# The state store persists plugin runtime state (source positions, bootstrap
# state, etc.) so it survives restarts. Only `kind: redb` is supported by the
# server today. This is an instance-level setting and is NOT REST-creatable, so
# it must live in the server config file.
#
# The state store file is written to ./data/state.redb relative to the server's
# working directory (the driver runs the server from WORK_DIR, so it lands in
# scratch). Sources/queries/reactions are still applied dynamically via the
# admin REST API. Results (determinism SHAs) must not change vs standard.

apiVersion: drasi.io/v1
id: building-comfort-dynamic
host: "0.0.0.0"
port: 8080
logLevel: info
persistConfig: false

stateStore:
  kind: redb
  path: ./data/state.redb

autoInstallPlugins: true
# Disable cosign signature verification so locally-built plugins are loaded
# without a signed lockfile (mirrors the static ci configs).
verifyPlugins: false
plugins:
  - ref: source/grpc
  - ref: source/http
  - ref: reaction/grpc
  - ref: reaction/http
  - ref: reaction/log

# No sources / queries / reactions: applied dynamically via the REST API.
sources: []
queries: []
reactions: []
