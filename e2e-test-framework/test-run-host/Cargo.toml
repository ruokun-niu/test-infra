[package]
name = "test-run-host"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tonic-prost-build = "0.14"

[dependencies]
# Drasi core library (all middleware, using system libjq instead of bundled-jq)
drasi-lib = { version = "0.6.0", features = [
  "middleware-jq",
  "middleware-decoder",
  "middleware-map",
  "middleware-parse-json",
  "middleware-promote",
  "middleware-relabel",
  "middleware-unwind",
] }

# Core models (for SourceMiddlewareConfig and other shared types)
drasi-core = "0.4.2"

# Core bootstrap providers (used by the application API)
drasi-bootstrap-noop = "0.1.12"
drasi-bootstrap-application = "0.1.13"

# Core reaction (used by the application API)
drasi-reaction-application = "0.2.11"

# Application source (programmatic event injection into a hosted drasi-lib instance)
drasi-source-application = "0.1.13"

drasi-comms-abstractions = { path = "../infrastructure/comms-abstractions" }
drasi-comms-dapr = { path = "../infrastructure/comms-dapr" }
test-data-store = { path = "../test-data-store" }

anyhow = "1.0.86"
async-trait = "0.1.81"
axum = "0.6.19"
azure_core = "0.20.0"
azure_storage = "0.20.0"
azure_storage_blobs = "0.20.0"
chrono = { version = "0.4.38", features = ["serde"] }
derive_more = { version = "1.0.0", features = ["debug"] }
env_logger = "0.7.1"
futures = "0.3.3"
generational-arena = "0.2.9"
governor = "0.8.1"
hex = "0.4"
image = "0.24"
log = "0.4"
parking_lot = "0.12.1"
rand = "0.9.0"
rand_chacha = "0.9.0"
rand_distr = "0.5.1"
rand_pcg = "0.3.1"
redis = { version = "0.27.5", features = ["tokio-comp"] }
reqwest = { version = "0.11.24", features = ["json"] }
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
sha2 = "0.10"
tempfile = "3.2"
thiserror = "1.0.63"
time = "0.3.37"
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1.37.0", features = ["full"] }
tokio-stream = "0.1.17"
tracing = "0.1.37"
tracing-opentelemetry = "0.21"
tracing-subscriber = {version = "0.3.17", features = ["env-filter"]}
utoipa = { version = "4.2", features = ["chrono"] }
uuid = { version = "1.0", features = ["v4"] }
walkdir = "2.5.0"
opentelemetry_api = "0.20"
opentelemetry = { version = "0.20", features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.13", features = ["metrics"] }
opentelemetry_sdk = { version = "0.20", features = ["rt-tokio", "metrics", "trace"] }
opentelemetry-semantic-conventions = "0.12"
portpicker = "0.1"